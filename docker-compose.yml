# Single-service stack for Dockge / Docker Compose.
# BLE collector + Mosquitto + SQLite + web UI in one container.

services:
  sensor:
    image: ghcr.io/simonbolton/sensor/collector:latest
    build:
      context: ./collector
    restart: unless-stopped
    privileged: true
    network_mode: host
    # Ubuntu AppArmor blocks BlueZ D-Bus from containers without this.
    security_opt:
      - apparmor:unconfined
    environment:
      SENSORS: ${SENSORS:-outdoor=AA:BB:CC:DD:EE:FF}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-sensors/switchbot}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-900}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-60}
      RETENTION_DAYS: ${RETENTION_DAYS:-730}
      WEB_PORT: ${WEB_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_MQTT: ${ENABLE_MQTT:-true}
      SQLITE_PATH: /data/sensors.db
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: 1883
    volumes:
      # Bind mount — no named volume declaration needed (Dockge-friendly)
      - ./data:/data
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
