listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Topic layout (documented; not enforced by ACL in v1):
#   sensors/switchbot/{mac}/telemetry   JSON reading from the BLE collector
#   sensors/switchbot/{mac}/status      online/offline style status (optional)
